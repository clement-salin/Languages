# Déployé dans /root/languages sur le VPS, à côté d'un fichier .env qui
# contient SYNC_TOKEN (jamais dans le dépôt).
#
# L'image n'est pas construite sur le serveur : elle y arrive toute faite,
# par la CI ou par scripts/deploy.sh. Le VPS ne reçoit ni code source ni
# accès au dépôt.
#
#   docker compose up -d

services:
  languages:
    image: languages:latest
    # Nom fixe : c'est sous ce nom que le Caddy principal joint l'app.
    container_name: languages
    restart: unless-stopped

    environment:
      DATA_DIR: /data
      # Le « :? » fait échouer le démarrage avec un message clair si le jeton
      # manque, plutôt que de lancer l'app avec la synchronisation éteinte
      # sans que rien ne le signale.
      SYNC_TOKEN: ${SYNC_TOKEN:?absent — cree un fichier .env a cote de ce docker-compose.yml}
      # Clé DeepL, facultative au contraire du jeton : absente, seule la
      # suggestion de traduction est éteinte.
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}

    volumes:
      # Volume nommé : la base SQLite survit aux mises à jour de l'image.
      - languages-data:/data

    # Aucun port publié : le Caddy principal joint le conteneur par le
    # réseau Docker `web`.
    networks:
      - web

volumes:
  languages-data:

networks:
  web:
    external: true
