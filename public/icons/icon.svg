<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Deux bulles de dialogue : l'allemand devant, l'anglais derrière. -->
  <rect width="512" height="512" rx="112" fill="#f7f6f3"/>
  <!-- Bulle arrière : l'anglais (bleu marine). -->
  <rect x="200" y="118" width="200" height="150" rx="40" fill="#2a5a94"/>
  <path d="M342 260 L372 316 L298 260 Z" fill="#2a5a94"/>
  <rect x="236" y="150" width="128" height="16" rx="8" fill="#f7f6f3" opacity="0.9"/>
  <rect x="236" y="182" width="92" height="16" rx="8" fill="#f7f6f3" opacity="0.9"/>
  <!-- Liseré couleur du fond, pour détacher la bulle avant. -->
  <rect x="112" y="200" width="220" height="164" rx="44" fill="none" stroke="#f7f6f3" stroke-width="24"/>
  <path d="M152 356 L136 414 L206 356 Z" fill="none" stroke="#f7f6f3" stroke-width="24" stroke-linejoin="round"/>
  <!-- Bulle avant : l'allemand (brique). -->
  <rect x="112" y="200" width="220" height="164" rx="44" fill="#a33a2c"/>
  <path d="M152 356 L136 414 L206 356 Z" fill="#a33a2c"/>
  <rect x="148" y="250" width="148" height="16" rx="8" fill="#f7f6f3"/>
  <rect x="148" y="282" width="148" height="16" rx="8" fill="#f7f6f3"/>
  <rect x="148" y="314" width="92" height="16" rx="8" fill="#f7f6f3"/>
</svg>
